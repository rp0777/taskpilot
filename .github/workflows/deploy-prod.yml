name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build --workspace=apps/web

      - name: Build backend
        run: npm run build --workspace=apps/api

      - name: Deploy frontend
        run: echo "Deploying frontend to production (replace with Vercel/Railway CLI)"

      - name: Deploy backend
        run: echo "Deploying backend to production (replace with Vercel/Railway CLI)"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0].replace(/-/g, '');
            const shortSha = context.sha.substring(0, 7);
            const tag = `v${date}-${shortSha}`;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: `Production deployment from commit ${context.sha}`,
              target_commitish: context.sha,
            });

            console.log(`Created release ${tag}`);
